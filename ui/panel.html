<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PRISM panel</title>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Panel sections">
    <button data-sec="site" title="Site report: trust score, cookies, trackers, scripts (Ctrl+Shift+S)">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.4-3 7.8-7 9-4-1.2-7-4.6-7-9V6z"/><path d="M9 12l2 2 4-4"/></svg></button>
    <button data-sec="network" title="Network: request log, protection, encrypted DNS">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h13M18 10l3 2-3 2"/></svg></button>
    <button data-sec="source" title="Source explorer: HTML, metadata, headers, resources">
      <svg viewBox="0 0 24 24"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5"/></svg></button>
    <button data-sec="design" title="AI design review: Claude spots front-end imperfections (Ctrl+Shift+D)">
      <svg viewBox="0 0 24 24"><path d="M3 21l3-1 11-11-2-2L4 18zM14 6l2 2M18 3l.7 1.8L20.5 5.5l-1.8.7L18 8l-.7-1.8-1.8-.7 1.8-.7zM20 13l.5 1.2 1.2.5-1.2.5L20 16.4l-.5-1.2-1.2-.5 1.2-.5z"/></svg></button>
    <button data-sec="api" title="API tester (Ctrl+Shift+A)">
      <svg viewBox="0 0 24 24"><path d="M4 8h11M11 4l4 4-4 4M20 16H9M13 12l-4 4 4 4"/></svg></button>
    <button data-sec="terminal" title="Terminal (Ctrl+`)">
      <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM7 10l3 2-3 2M12 15h5"/></svg></button>
    <i class="sep"></i>
    <button data-sec="memory" title="Tab memory monitor">
      <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6zM9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4M9.5 9.5h5v5h-5z"/></svg></button>
    <button data-sec="containers" title="Containers, temporary sessions, sandbox">
      <svg viewBox="0 0 24 24"><path d="M3 7l9-4 9 4-9 4zM3 12l9 4 9-4M3 17l9 4 9-4"/></svg></button>
    <button data-sec="permissions" title="Permission control center">
      <svg viewBox="0 0 24 24"><path d="M12 14a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM5 20c1.5-3 4-4.5 7-4.5s5.5 1.5 7 4.5M19 4v4M17 6h4"/></svg></button>
    <button data-sec="vault" title="Password vault">
      <svg viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></button>
    <button data-sec="bookmarks" title="Developer bookmarks: links, docs, snippets, endpoints">
      <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg></button>
  </nav>

  <main class="main">
    <header class="head">
      <h1 id="sec-title">Site</h1>
      <span id="sec-sub" class="sub"></span>
      <div class="head-actions" id="head-actions"></div>
    </header>
    <div class="body" id="body">
      <section data-view="site"></section>
      <section data-view="network"></section>
      <section data-view="source"></section>
      <section data-view="design"></section>
      <section data-view="api"></section>
      <section data-view="terminal"></section>
      <section data-view="memory"></section>
      <section data-view="containers"></section>
      <section data-view="permissions"></section>
      <section data-view="vault"></section>
      <section data-view="bookmarks"></section>
    </div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="tip" class="tip" hidden></div>
<script src="panel.js"></script>
</body>
</html>

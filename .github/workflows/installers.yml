# Builds every PRISM installer, checks they install and start, and publishes
# them as the GitHub release of the tag.
#
#   Windows  PRISM-Setup-<version>.exe (Inno Setup; the file one-click updates download)
#   Linux    .run (any distro), .deb, .rpm. Built with a portable Python and
#            no system libraries bundled, so the build needs glibc 2.34 at most
#            (Qt 6.12's floor) and runs on every distro tested below.
#   macOS    .dmg (Apple silicon)
#
# On a version tag (git push origin v1.2.1): build, test, then create the
# release for that tag with all files attached (pre-release for -beta tags).
# By hand from the Actions tab: build and test only; the files are under the
# run's Artifacts.

name: Installers

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build (PRISM-Setup-<version>.exe)
        shell: cmd
        run: packaging\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: prism-windows
          path: dist/PRISM-Setup-*.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build tools, and the libraries Qt WebEngine loads while PyInstaller analyses it
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm binutils libasound2 libdbus-1-3 libdrm2 libegl1 \
            libfontconfig1 libgbm1 libgl1 libglib2.0-0 libnspr4 libnss3 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 \
            libxcb-xinerama0 libxcb-xkb1 libxcomposite1 libxdamage1 libxkbcommon-x11-0 libxkbcommon0 libxkbfile1 \
            libxrandr2 libxshmfence1 libxtst6 libgssapi-krb5-2 libbrotli1 libpulse0 libcups2 libwayland-client0 \
            libwayland-cursor0 libwayland-egl1
      - uses: astral-sh/setup-uv@v6
      - name: Portable Python 3.14 (python-build-standalone, glibc 2.17)
        run: |
          uv python install 3.14
          echo "PYTHON=$(ls -d "$(uv python dir)"/cpython-3.14*/bin/python3.14 | head -1)" >> "$GITHUB_ENV"
      - name: Build (.run, .deb, .rpm)
        run: packaging/build_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: prism-linux
          if-no-files-found: error
          path: |
            dist/*.run
            dist/*.deb
            dist/*.rpm

  linux-test:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04",            kind: deb }
          - { image: "ubuntu:24.04",            kind: deb }
          - { image: "debian:12",               kind: deb }
          - { image: "fedora:latest",           kind: rpm-dnf }
          - { image: "rockylinux:9",            kind: rpm-dnf }
          - { image: "opensuse/tumbleweed",     kind: rpm-zypper }
          - { image: "archlinux:latest",        kind: run }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prism-linux
      - name: Install
        run: |
          set -eux
          case "${{ matrix.kind }}" in
            deb)        apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ./prism_*.deb ;;
            rpm-dnf)    if grep -qi 'rhel' /etc/os-release; then dnf install -y epel-release; fi   # xcb-util-cursor
                        dnf install -y ./prism-*.rpm ;;
            rpm-zypper) zypper --non-interactive install --allow-unsigned-rpm ./prism-*.rpm ;;
            run)        pacman -Syu --noconfirm nss alsa-lib libxkbcommon-x11 xcb-util-cursor xcb-util-wm \
                          xcb-util-image xcb-util-keysyms xcb-util-renderutil libxkbfile libxshmfence \
                          libxcomposite libxdamage libxrandr libxtst mesa fontconfig krb5 brotli libpulse \
                          libcups wayland ttf-dejavu
                        sh ./PRISM-*-setup.run -y ;;
          esac
      - name: Smoke test (PRISM must start)
        shell: bash
        run: |
          set +e
          # Containers can't create the namespaces Chromium's sandbox uses;
          # the container is the sandbox here.
          # Headless (offscreen) Chromium crashes in its GPU code; on a real
          # display it doesn't. The test only checks that PRISM starts.
          export QT_QPA_PLATFORM=offscreen QTWEBENGINE_DISABLE_SANDBOX=1 QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu
          PRISM=$(command -v prism || echo /opt/prism/PRISM)
          timeout 40 "$PRISM" > run.log 2>&1
          grep -vE "^\[[0-9:/.]+(ERROR|WARNING)" run.log | tail -30
          grep -q "blocked domains" run.log || { echo "::error::PRISM did not start on ${{ matrix.image }}"; exit 1; }
          if grep -q "Traceback" run.log; then echo "::error::Python error at startup"; exit 1; fi

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build (.app, .dmg)
        run: PYTHON=python3.14 packaging/build_macos.sh
      - name: Smoke test (PRISM must start)
        run: |
          set +e
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS=--disable-gpu perl -e 'alarm 40; exec @ARGV' dist/PRISM.app/Contents/MacOS/PRISM > run.log 2>&1
          tail -30 run.log
          grep -q "blocked domains" run.log || { echo "::error::PRISM did not start on macOS"; exit 1; }
          if grep -q "Traceback" run.log; then echo "::error::Python error at startup"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: prism-macos
          path: dist/*.dmg
          if-no-files-found: error

  release:
    # Only for version tags, and only once every installer is built and tested.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-test, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - run: ls -la files
      - id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: PRISM ${{ steps.v.outputs.version }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            files/PRISM-Setup-*.exe
            files/*.dmg
            files/*.run
            files/*.deb
            files/*.rpm
